<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f17" />
      <stop offset="40%" stop-color="#181825" />
      <stop offset="70%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- Glowing Nebula Orbs -->
    <radialGradient id="orbMauve" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbSapphire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#74c7ec" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#89b4fa" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c2e7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#eba0ac" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94e2d5" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#1e1e2e" stop-opacity="0" />
    </radialGradient>

    <!-- Mesh Line Gradients -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb" stop-opacity="0" />
      <stop offset="50%" stop-color="#74c7ec" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#313244" stroke-width="1" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="3840" height="2160" fill="url(#bg)" />

  <!-- Subtle Cyber Grid Overlay -->
  <rect width="3840" height="2160" fill="url(#grid)" />

  <!-- Ambient Light Blobs -->
  <circle cx="900" cy="650" r="950" fill="url(#orbMauve)" />
  <circle cx="2900" cy="1400" r="1100" fill="url(#orbSapphire)" />
  <circle cx="1920" cy="1080" r="850" fill="url(#orbPink)" />
  <circle cx="2800" cy="400" r="700" fill="url(#orbTeal)" />
  <circle cx="600" cy="1700" r="800" fill="url(#orbSapphire)" />

  <!-- Elegant Flow Waves -->
  <path d="M -200 1200 C 600 800, 1200 1600, 2000 1100 C 2800 600, 3400 1300, 4100 950" fill="none" stroke="url(#lineGrad1)" stroke-width="3" />
  <path d="M -200 1300 C 700 900, 1300 1700, 2100 1200 C 2900 700, 3500 1400, 4100 1050" fill="none" stroke="url(#lineGrad2)" stroke-width="2" stroke-dasharray="12 16" />
  <path d="M -200 1450 C 500 1100, 1400 1850, 2200 1350 C 3000 850, 3600 1550, 4100 1200" fill="none" stroke="url(#lineGrad1)" stroke-width="1.5" />

  <!-- Modern Geometric Accent Rings -->
  <circle cx="1920" cy="1080" r="480" fill="none" stroke="#cba6f7" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 14" />
  <circle cx="1920" cy="1080" r="620" fill="none" stroke="#89b4fa" stroke-width="1" stroke-opacity="0.1" />
  <circle cx="1920" cy="1080" r="760" fill="none" stroke="#f5c2e7" stroke-width="0.8" stroke-opacity="0.08" stroke-dasharray="20 20" />

  <!-- Micro Constellation Stars -->
  <g fill="#cdd6f4" opacity="0.6">
    <circle cx="450" cy="320" r="2.5" />
    <circle cx="1200" cy="240" r="1.8" />
    <circle cx="1600" cy="420" r="3.0" opacity="0.8" />
    <circle cx="2300" cy="280" r="2.2" />
    <circle cx="3200" cy="380" r="2.8" />
    <circle cx="3500" cy="720" r="1.5" />
    <circle cx="350" cy="1420" r="2.0" />
    <circle cx="820" cy="1820" r="3.2" opacity="0.9" />
    <circle cx="1450" cy="1920" r="2.0" />
    <circle cx="2450" cy="1780" r="2.6" />
    <circle cx="3100" cy="1650" r="1.8" />
    <circle cx="3550" cy="1890" r="2.4" />
    <circle cx="1920" cy="280" r="2.0" />
    <circle cx="2750" cy="920" r="2.5" />
    <circle cx="1050" cy="1180" r="2.2" />
  </g>
</svg>
