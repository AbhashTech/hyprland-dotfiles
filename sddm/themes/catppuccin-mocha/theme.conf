[General]
# Background Image (relative path or absolute path)
Background="assets/background.svg"

# Display Scale Multiplier (1.0 = 100%)
Scale=1.0

# Fonts
FontFamily="JetBrainsMono Nerd Font"
HeaderFontFamily="JetBrainsMono Nerd Font"
FontSize=13

# Catppuccin Mocha Color Palette
AccentColor="#cba6f7"
AccentHoverColor="#b4befe"
BackgroundColor="#1e1e2e"
CardBackgroundColor="#181825"
CardBorderColor="#313244"
CardBorderFocusColor="#cba6f7"
TextColor="#cdd6f4"
SubtextColor="#a6adc8"
ErrorColor="#f38ba8"
WarningColor="#fab387"
SuccessColor="#a6e3a1"

# Date & Clock Formats
ClockFormat="HH:mm"
DateFormat="dddd, MMMM d, yyyy"
ShowGreeting=true

# UI Elements Visibility
ShowSessions=true
ShowPowerButtons=true
ShowBattery=true
ShowHost=true
ShowCapsLockWarning=true

# Password Input Configuration
PlaceholderText="Enter Password..."
AvatarRound=true
DimBackground=0.25
