# =============================================================================
# Fuzzel Configuration
# Modern, lightweight Wayland application launcher & dmenu
# Catppuccin Mocha Theme
# =============================================================================

[main]
font=JetBrainsMono Nerd Font:weight=bold:size=12
prompt="   Search: "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=kitty
lines=8
width=36
tabs=4
horizontal-pad=22
vertical-pad=16
inner-pad=10
image-size-ratio=0.5
line-height=26
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# One Light Pro RGBA
background=f0f0f0f0
text=383a42ff
prompt=4078f2ff
placeholder=696c77ff
input=383a42ff
match=4078f2ff
selection=e0e0e0ff
selection-text=e5e5e6ff
selection-match=4078f2ff
border=4078f2aa

[border]
width=2
radius=16

[dmenu]
mode=text
exit-immediately-if-empty=no
