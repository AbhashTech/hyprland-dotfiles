# =============================================================================
# Fuzzel Configuration
# Modern, lightweight Wayland application launcher & dmenu
# Catppuccin Mocha Theme
# =============================================================================

[main]
font=JetBrainsMono Nerd Font:weight=bold:size=12
prompt="   Search: "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=kitty
lines=8
width=36
tabs=4
horizontal-pad=22
vertical-pad=16
inner-pad=10
image-size-ratio=0.5
line-height=26
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Gruvbox Light RGBA
background=f2e5bcf0
text=3c3836ff
prompt=af3a03ff
placeholder=928374ff
input=3c3836ff
match=af3a03ff
selection=d5c4a1ff
selection-text=ebdbb2ff
selection-match=af3a03ff
border=af3a03aa

[border]
width=2
radius=16

[dmenu]
mode=text
exit-immediately-if-empty=no
