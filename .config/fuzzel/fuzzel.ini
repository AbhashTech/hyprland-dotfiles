# =============================================================================
# Fuzzel Configuration
# Modern, lightweight Wayland application launcher & dmenu
# Catppuccin Mocha Theme
# =============================================================================

[main]
font=JetBrainsMono Nerd Font:weight=bold:size=12
prompt="   Search: "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=kitty
lines=8
width=36
tabs=4
horizontal-pad=22
vertical-pad=16
inner-pad=10
image-size-ratio=0.5
line-height=26
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Nord Arctic RGBA
background=242933ea
text=eceff4ff
prompt=88c0d0ff
placeholder=616e88ff
input=eceff4ff
match=88c0d0ff
selection=3b4252ff
selection-text=ffffffef
selection-match=b48eadff
border=88c0d088

[border]
width=2
radius=16

[dmenu]
mode=text
exit-immediately-if-empty=no
