# =============================================================================
# Fuzzel Configuration
# Modern, lightweight Wayland application launcher & dmenu
# Catppuccin Mocha Theme
# =============================================================================

[main]
font=JetBrainsMono Nerd Font:weight=bold:size=12
prompt="   Search: "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=kitty
lines=8
width=36
tabs=4
horizontal-pad=22
vertical-pad=16
inner-pad=10
image-size-ratio=0.5
line-height=26
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Catppuccin Macchiato RGBA
background=1e2030ea
text=cad3f5ff
prompt=c6a0f6ff
placeholder=6e738dff
input=cad3f5ff
match=c6a0f6ff
selection=363a4fff
selection-text=ffffffef
selection-match=f5bde6ff
border=c6a0f688

[border]
width=2
radius=16

[dmenu]
mode=text
exit-immediately-if-empty=no
