# =============================================================================
# Fuzzel Configuration
# Modern, lightweight Wayland application launcher & dmenu
# Catppuccin Mocha Theme
# =============================================================================

[main]
font=JetBrainsMono Nerd Font:weight=bold:size=12
prompt="   Search: "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=no
terminal=kitty
lines=8
width=36
tabs=4
horizontal-pad=22
vertical-pad=16
inner-pad=10
image-size-ratio=0.5
line-height=26
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Catppuccin Mocha RGBA (RRGGBBAA hex)
background=181825ea
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=cba6f7ff
selection=313244ff
selection-text=ffffffef
selection-match=f5c2e7ff
border=cba6f788

[border]
width=2
radius=16

[dmenu]
mode=text
exit-immediately-if-empty=no
