# -*- conf -*-
# =============================================================================
# Foot Terminal Configuration - Wayland Native Terminal Emulator
# =============================================================================

# --- Dynamic Theme Colors ---
include=~/.config/foot/theme.ini

font=JetBrainsMono Nerd Font:size=11.5
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11.5
font-italic=JetBrainsMono Nerd Font:style=Italic:size=11.5
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=11.5
pad=12x12
selection-target=both

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.92

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o
unicode-input=Control+Shift+u
