# THEME
source = ~/.config/hypr/theme.conf

# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/assets/lock_bg.jpg
    blur_passes = 0
    contrast = 0.95
    brightness = 0.95
    vibrancy = 0.1
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# LEFT FROSTED GLASS SIDEBAR PANEL
shape {
    monitor =
    size = 480, 1080
    color = rgba(20, 22, 33, 0.82)
    rounding = 0
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    position = 0, 0
    halign = left
    valign = center
}

# TOP-LEFT HEADER / HOST
label {
    monitor =
    text = cmd[update:10000] echo "✕ $(hostname)"
    color = $subtext0
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 20, -20
    halign = left
    valign = top
}

# GREETING
label {
    monitor =
    text = Welcome!
    color = $text
    font_size = 28
    font_family = JetBrainsMono Nerd Font Bold
    position = 80, 180
    halign = left
    valign = center
}

# TIME (Hours:Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 60
    font_family = JetBrainsMono Nerd Font Bold
    position = 80, 95
    halign = left
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d of %B")"
    color = $subtext1
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 80, 40
    halign = left
    valign = center
}

# USERNAME PILL
label {
    monitor =
    text = cmd[update:10000] echo "  $(whoami)"
    color = $text
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 80, -35
    halign = left
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.45)
    inner_color = rgba(20, 22, 33, 0.65)
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    hide_input = false
    rounding = 23
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    capslock_color = $peach
    numlock_color = -1
    bothlock_color = -1
    position = 80, -100
    halign = left
    valign = center
    shadow_passes = 0
}

# BOTTOM POWER MENU ACTION HINTS
label {
    monitor =
    text = 󰤄 Suspend       󰜉 Reboot       󰐥 Shutdown
    color = $subtext0
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 80, 45
    halign = left
    valign = bottom
}


