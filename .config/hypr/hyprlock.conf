# =============================================================================
# Hyprlock Configuration - Catppuccin Mocha Theme
# =============================================================================

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# TIME (Hours:Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(205, 214, 244) # $text
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(180, 190, 254) # $lavender
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# USER AVATAR / ICON
image {
    monitor =
    path = $HOME/.face.icon
    size = 100
    rounding = -1 # circle
    border_size = 3
    border_color = rgb(203, 166, 247) # $mauve
    position = 0, -20
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.28 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(203, 166, 247) # $mauve
    inner_color = rgb(30, 30, 46)     # $base
    font_color = rgb(205, 214, 244)   # $text
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    rounding = 14
    check_color = rgb(249, 226, 175) # $yellow
    fail_color = rgb(243, 139, 168)  # $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(250, 179, 135) # $peach
    numlock_color = -1
    bothlock_color = -1
    position = 0, -110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# LOCK STATUS / BATTERY
label {
    monitor =
    text = cmd[update:5000] echo "🔒 $(whoami)@$(hostname) $([ -d /sys/class/power_supply/BAT* ] && echo "• $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)%")"
    color = rgb(166, 173, 200) # $subtext0
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
