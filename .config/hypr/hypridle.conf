# =============================================================================
# Hypridle Configuration - Hyprland Idle Daemon
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Command to run on dbus lock-session
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn display back on after resume
    ignore_dbus_inhibit = false                 # Respect media players inhibiting idle
}

# 1. Dim screen brightness after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2. Lock screen after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off displays after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend system after 30 minutes (1800s)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
