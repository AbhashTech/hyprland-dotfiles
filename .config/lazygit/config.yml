# =============================================================================
# Lazygit Configuration - One Light Pro
# =============================================================================

gui:
  theme:
    activeBorderColor:
      - '#4078f2'
      - bold
    inactiveBorderColor:
      - '#a0a1a7'
    optionsTextColor:
      - '#4078f2'
    selectedLineBgColor:
      - '#e0e0e0'
    cherryPickedCommitBgColor:
      - '#d0d0d0'
    cherryPickedCommitFgColor:
      - '#4078f2'
    unstagedChangesColor:
      - '#e45649'
    defaultFgColor:
      - '#383a42'
    searchingActiveBorderColor:
      - '#c18401'

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --hyperlinks --side-by-side
