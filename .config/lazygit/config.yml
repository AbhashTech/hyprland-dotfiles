# =============================================================================
# Lazygit Configuration - Gruvbox Light
# =============================================================================

gui:
  theme:
    activeBorderColor:
      - '#af3a03'
      - bold
    inactiveBorderColor:
      - '#a89984'
    optionsTextColor:
      - '#076678'
    selectedLineBgColor:
      - '#d5c4a1'
    cherryPickedCommitBgColor:
      - '#bdae93'
    cherryPickedCommitFgColor:
      - '#af3a03'
    unstagedChangesColor:
      - '#9d0006'
    defaultFgColor:
      - '#3c3836'
    searchingActiveBorderColor:
      - '#b57614'

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --hyperlinks --side-by-side
