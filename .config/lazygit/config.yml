# =============================================================================
# Lazygit Configuration - Everforest Light
# =============================================================================

gui:
  theme:
    activeBorderColor:
      - '#8da101'
      - bold
    inactiveBorderColor:
      - '#bdbaa3'
    optionsTextColor:
      - '#3a94c5'
    selectedLineBgColor:
      - '#e5dfc5'
    cherryPickedCommitBgColor:
      - '#d8d3ba'
    cherryPickedCommitFgColor:
      - '#8da101'
    unstagedChangesColor:
      - '#f85552'
    defaultFgColor:
      - '#5c6a72'
    searchingActiveBorderColor:
      - '#dfa000'

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --hyperlinks --side-by-side
