# =============================================================================
# Lazygit Configuration - Catppuccin Latte
# =============================================================================

gui:
  theme:
    activeBorderColor:
      - '#8839ef'
      - bold
    inactiveBorderColor:
      - '#acb0be'
    optionsTextColor:
      - '#1e66f5'
    selectedLineBgColor:
      - '#ccd0da'
    cherryPickedCommitBgColor:
      - '#bcc0cc'
    cherryPickedCommitFgColor:
      - '#8839ef'
    unstagedChangesColor:
      - '#d20f39'
    defaultFgColor:
      - '#4c4f69'
    searchingActiveBorderColor:
      - '#df8e1d'

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers --hyperlinks --side-by-side
